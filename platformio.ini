; =============================================================================
; OUI-SPY Unified — Heltec WiFi LoRa 32 V4
;   ESP32-S3 · 16 MB flash · 2 MB quad PSRAM · native USB · on-board OLED
;
; Single target. `pio run` builds; `pio run -t upload` flashes over USB;
; `pio device monitor -b 115200` for serial. The Heltec V4 is an ESP32-S3, so
; this uses the standard espressif32 (Arduino core 2.x) toolchain — no
; compatibility shims.
; =============================================================================

[platformio]
default_envs = heltec_wifi_lora_32_v4

[env:heltec_wifi_lora_32_v4]
platform = espressif32@^6.3.0
board = heltec_wifi_lora_32_V3          ; V4 is pin-compatible with V3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    mathieucarbou/ESP Async WebServer@^3.0.6
    mathieucarbou/Async TCP@^3.1.4
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.0.4
    mikalhart/TinyGPSPlus@^1.1.0
    adafruit/Adafruit SSD1306@^2.5.7    ; on-board OLED

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -Isrc/raw
    ; --- Heltec V4 pin map (override the #ifndef-guarded defaults in src) ---
    ; LED on GPIO35 (active-high, so it reads inverted); GPIO21 is the OLED
    ; reset here, not an LED. No on-board buzzer or NeoPixel — GPIO7/GPIO4 are
    ; free header pads for optional external parts (alerts are silent without
    ; them). BOOT/PRG button is GPIO0. Native USB via USB-Serial-JTAG.
    -DLED_PIN=35
    -DPCAP_LED_PIN=35
    -DBLESNIFF_LED_PIN=35
    -DBUZZER_PIN=7
    -DPCAP_BUZZER_PIN=7
    -DBLESNIFF_BUZZER_PIN=7
    -DNEOPIXEL_PIN=4
    ; -DOUISPY_FORCE_MODE=<n> (optional) boots straight into mode n, bypassing
    ; the web selector, and prints PSRAM/heap — handy for bench testing.

board_build.arduino.memory_type = qio_qspi   ; 2 MB quad PSRAM (not octal)
board_build.partitions = partitions_16mb.csv
board_build.filesystem = spiffs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB

build_src_filter = +<*> -<raw/>
