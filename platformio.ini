; =============================================================================
; OUI-SPY Unified Firmware — multi-target
;   env:seeed_xiao_esp32s3    → Seeed XIAO ESP32-S3 (8 MB, octal PSRAM)
;   env:seeed_xiao_esp32c6    → Seeed XIAO ESP32-C6 (4 MB, no PSRAM, single core)
;   env:heltec_wifi_lora_32_v4→ Heltec WiFi LoRa 32 V4 (16 MB, 2 MB quad PSRAM)
;
; `pio run` builds the C6 by default (see default_envs). Build another target
; with e.g. `pio run -e heltec_wifi_lora_32_v4`.
; The S3 and Heltec V4 are both ESP32-S3, so they share the original core-2.x
; code path (no compat shims); only the C6 needs src/compat_esp32c6.h.
; =============================================================================

[platformio]
default_envs = seeed_xiao_esp32c6

; -----------------------------------------------------------------------------
; Settings shared by every environment.
; -----------------------------------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; NimBLE and the Async web stack are pinned per-env (see each env below):
;  - NimBLE 1.4.x can't target the C6's Bluetooth controller  -> C6 uses 2.x
;  - AsyncTCP 3.1.x doesn't take the lwIP core lock, which the C6 SDK enables
;    (CONFIG_LWIP_TCPIP_CORE_LOCKING=y) -> C6 uses the esp32async fork.
; Everything else is shared here.
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.0.4
    mikalhart/TinyGPSPlus@^1.1.0

; =============================================================================
; Seeed XIAO ESP32-S3 — the original target, unchanged.
; =============================================================================
[env:seeed_xiao_esp32s3]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32s3

lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^1.4.2
    mathieucarbou/ESP Async WebServer@^3.0.6
    mathieucarbou/Async TCP@^3.1.4

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -Isrc/raw

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB

build_src_filter = +<*> -<raw/>

; =============================================================================
; Seeed XIAO ESP32-C6 — the port.
;
; The C6 needs Arduino-ESP32 core 3.x (first core with C6 support), which the
; stock platformio/espressif32 platform does not ship. Use Seeed's own
; platform (below), or the community pioarduino fork (commented alternative).
; The C6 is a single-core RISC-V part with no PSRAM and 4 MB flash, so:
;   - drop -DBOARD_HAS_PSRAM and the Xtensa-only PSRAM cache-fix flag
;   - CPU tops out at 160 MHz (not 240)
;   - use the 4 MB partition table
;   - USB is USB-Serial-JTAG: -DARDUINO_USB_MODE=1 keeps Serial on USB
; Source-level core-2.x→3.x breakages (LEDC API, dual-core task pinning) and
; the different pin map are handled by src/compat_esp32c6.h, which is inert on
; every other target.
; =============================================================================
[env:seeed_xiao_esp32c6]
; The community pioarduino fork reports its platform name as "espressif32", so
; the espressif32-gated libraries (ESPAsyncWebServer + AsyncTCP) resolve exactly
; as they do on the S3 build. This is the tested, working toolchain for the port.
platform = https://github.com/pioarduino/platform-espressif32.git#develop
board = seeed_xiao_esp32c6
; --- Alternative: Seeed's own platform. It reports as "SeeedStudio", which makes
;     the espressif32-gated async libs need lib_compat_mode=off (set below) AND
;     still trips its custom build script — prefer pioarduino above.
; platform = https://github.com/Seeed-Studio/platform-seeedboards.git
; board = seeed-xiao-esp32-c6

; NimBLE 2.x — required for the C6's Bluetooth controller (1.4.x won't build for
; it). The scan-callback API differs from 1.4.x; src/nimble_compat_c6.h bridges
; it so the same mode sources build on both NimBLE versions.
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^2.1.0
    ; esp32async fork: acquires the lwIP core lock, required by the C6 SDK's
    ; CONFIG_LWIP_TCPIP_CORE_LOCKING. The old mathieucarbou 3.1.4 asserts at
    ; tcp_alloc() on boot (server.begin) under ESP-IDF 5.x.
    esp32async/ESPAsyncWebServer@^3.12.0
    esp32async/AsyncTCP@^3.5.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -Isrc/raw

; The Seeed platform reports its name as "SeeedStudio", not "espressif32", so
; ESPAsyncWebServer + AsyncTCP (which gate their library.json to espressif32)
; get filtered out by the default soft compatibility check. Turn the filter off
; so these installed libs are used. (The chips are espressif32-family regardless
; of the platform's registry name.)
lib_compat_mode = off

board_build.partitions = partitions_4mb.csv
board_build.filesystem = spiffs
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB

build_src_filter = +<*> -<raw/>

; =============================================================================
; Heltec WiFi LoRa 32 V4 — third target.
;
; Also an ESP32-S3 (like the XIAO S3), so it reuses the original core-2.x
; toolchain and code path — no compat shims, no library migrations. Differences
; from the XIAO S3 are all board wiring + flash/PSRAM geometry:
;   - 16 MB flash, 2 MB *quad* PSRAM  -> qio_qspi (not the XIAO's octal qio_opi)
;   - on-board white LED on GPIO35; GPIO21 is the OLED reset here (NOT an LED),
;     so LED_PIN must move off 21
;   - no on-board buzzer or NeoPixel -> BUZZER/NEOPIXEL point at free header
;     pads (GPIO7, GPIO4); with nothing wired the alert modes are silent
;   - BOOT/PRG button is GPIO0 (the S3 default) — unchanged
;   - native USB; USB-Serial-JTAG gives a stable CDC port (as on the C6)
; Pins are injected with -D flags, which win over the #ifndef-guarded defaults
; in the mode sources. The C6 shim (src/compat_esp32c6.h) is inert here.
;
; NOTE: the on-board LED (GPIO35) is active-HIGH while the firmware drives the
; status LED active-LOW, so on this board the LED reads inverted (lit at idle,
; dark on activity). Cosmetic; radios/dashboards are unaffected.
; =============================================================================
[env:heltec_wifi_lora_32_v4]
platform = espressif32@^6.3.0
board = heltec_wifi_lora_32_V3          ; V4 is pin-compatible with V3

lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^1.4.2
    mathieucarbou/ESP Async WebServer@^3.0.6
    mathieucarbou/Async TCP@^3.1.4

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -Isrc/raw
    ; --- Heltec V4 pin map (override the #ifndef-guarded defaults) ---
    -DLED_PIN=35
    -DPCAP_LED_PIN=35
    -DBLESNIFF_LED_PIN=35
    -DBUZZER_PIN=7
    -DPCAP_BUZZER_PIN=7
    -DBLESNIFF_BUZZER_PIN=7
    -DNEOPIXEL_PIN=4

board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions_16mb.csv
board_build.filesystem = spiffs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB

build_src_filter = +<*> -<raw/>
